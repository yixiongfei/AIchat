appId: com.letta.chat.desktop
productName: Letta Chat
copyright: Copyright 2024

directories:
  output: release

# asar 打包（native 模块需要 unpack）
asar: true
asarUnpack:
  - "node_modules/@nut-tree-fork/**"

files:
  - dist/**/*
  - package.json

# 打包时将 web 前端构建产物复制进来
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"

# 跳过代码签名（个人/内部使用不需要）
win:
  signingHashAlgorithms: []
  sign: null
  target:
    - target: portable
      arch:
        - x64
  icon: icon.ico

# portable 免安装版（双击直接运行，不需要安装）
portable:
  artifactName: "LettaChat-${version}-portable.exe"
