appId: com.letta.chat.desktop
productName: Letta Chat
copyright: Copyright 2024

directories:
  output: release

# asar 打包（native 模块需要 unpack）
asar: true
asarUnpack:
  - "node_modules/@nut-tree-fork/**"

files:
  - dist/**/*
  - package.json

# 打包时将 web 前端构建产物和托盘图标复制进来
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
  - from: microsoft_teams_alt_macos_bigsur_icon_189962.ico
    to: ../microsoft_teams_alt_macos_bigsur_icon_189962.ico

# 完全跳过代码签名（个人/内部使用）
forceCodeSigning: false

win:
  signAndEditExecutable: false
  signtoolOptions: {}
  target:
    - target: dir
      arch:
        - x64
  icon: icon.ico
