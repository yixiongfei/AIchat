services:
  api:
    image: node:20-alpine
    container_name: letta-api
    working_dir: /app
    volumes:
      - ../apps/api:/app:delegated
      - ../packages:/packages:delegated
      - api_node_modules:/app/node_modules
      - api_temp_audio:/app/temp_audio
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      # MySQL（宿主机）
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: 200106
      DB_NAME: letta_chat
      # 覆盖 .env 中的 Windows 路径为容器内路径
      TEMP_AUDIO_DIR: /app/temp_audio
    restart: unless-stopped
    command: sh -c "npm ci && npm run dev"

  web:
    image: node:20-alpine
    container_name: letta-web
    working_dir: /app
    volumes:
      - ../apps/web:/app:delegated
      - ../packages:/packages:delegated
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://letta-api:3001
    depends_on:
      - api
    restart: unless-stopped
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  api_node_modules:
  web_node_modules:
  api_temp_audio:
